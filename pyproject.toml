[project]
name = "m4-benchmarks"
version = "0.1.0"
description = "Python CPU benchmarks for Apple M4"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.27",
    "pandas>=2.0",
    "matplotlib>=3.8",
]

[tool.uv]
managed = true

[tool.ruff]
line-length = 255
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "N",    # pep8-naming
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie
    "RUF",  # ruff-specific
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
